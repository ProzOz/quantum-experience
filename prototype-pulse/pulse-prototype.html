<title>PULSE — mechanic prototype</title>

<!--
  PROTOTYPE — throwaway. Not production code.

  ROUND 1 answered the difficulty question (tightness is the ladder, count is
  the score, budget is a bounded speed tier — see README.md). Playtest verdict on
  round 2: "easier, but the game mechanic feels like shit."

  ROUND 3 (this file) attacks that. Three hypotheses for why hold-to-drive on a
  fast Bloch sphere feels bad:

    1. Too fast to read. The tip moves at up to omega*R px/s — at omega=11,
       R=170px that is ~1900 px/s free and ~3000 px/s driven, crossing the
       sphere in under 0.2s. You cannot see cause and effect, so you hold and
       hope. That is a slot machine with a hold button.
    2. The 3D projection is unreadable. Depth on a wireframe sphere is
       ambiguous, so you end up reading the number, not the picture.
    3. Hold-duration is mushy. Rhythm games are built on WHEN you tap.

  THE UNLOCK: ADR-0003 pinned omega to 9..13 because anything slower made
  targets unreachable inside the window. Targets are now generated as the
  endpoint of a real input word, so they are reachable at ANY omega. That
  constraint dissolved. omega is now free to be tuned for legibility instead of
  for a solver, and every variant here runs slow enough to actually read.

  Variants (?variant=A|B|C, or the bar at the bottom):

    A — SPHERE + HOLD   omega 4, with a forward preview of both futures
    B — DISC   + HOLD   same physics, drawn top-down (azimuthal equidistant)
    C — DISC   + TAP    discrete hard 90-degree pulses instead of holding

  A -> B isolates the VIEW. B -> C isolates the CONTROL.

  The disc is a real projection of the whole sphere: distance from centre is the
  polar angle theta (centre = |0>, rim = |1>), angle around is the phase phi. No
  hidden hemisphere, no depth ambiguity, and free precession becomes a clock
  hand sweeping at constant speed.

  Difficulty is the settled answer from round 1: tightness ladder, 4 targets,
  lock-in scoring (best fidelity reached while the target is live, locking in
  the instant you touch the bar). Deterministic throughout — no dice.

  No persistence — session only. (LINE in-app localStorage untested per ADR-0003.)
-->

<script>
if (!document.querySelector('meta[name=viewport]')) {
  const m = document.createElement('meta');
  m.name = 'viewport';
  m.content = 'width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1';
  document.head.appendChild(m);
}

/* ─────────────────────────────────────────────────────────────
   Physics. H = (w/2)sz + (W/2)sx, drive gated by the thumb.
   ───────────────────────────────────────────────────────────── */
const SUB_DT = 1 / 120;
const TAU = Math.PI * 2;

function step(s, omega, drive, dt) {
  const nn = Math.hypot(drive, omega);
  const th = nn * dt, c = Math.cos(th / 2), sn = Math.sin(th / 2);
  const u = -sn * (omega / nn), v = -sn * (drive / nn);
  const [ar, ai, br, bi] = s;
  return [c * ar - u * ai - v * bi, c * ai + u * ar + v * br,
          -v * ai + c * br + u * bi, v * ar + c * bi - u * br];
}
const bloch = ([ar, ai, br, bi]) => [2 * (ar * br + ai * bi), 2 * (ar * bi - ai * br),
                                     ar * ar + ai * ai - br * br - bi * bi];
const fidTo = (s, t) => { const r = bloch(s); return (1 + r[0] * t[0] + r[1] * t[1] + r[2] * t[2]) / 2; };
const clamp1 = (x) => Math.max(-1, Math.min(1, x));

/* ─────────────────────────────────────────────────────────────
   Mechanics. Every one runs slow enough to READ: the tip speed
   is omega*R px/s, and a phone tip is comfortably trackable to
   roughly 600 px/s. The shipped round-2 build was ~1900.
   ───────────────────────────────────────────────────────────── */
const MECH = {
  A: {
    key: 'A', view: 'sphere', control: 'hold',
    omega: 4.0, drive: 5.1, windowMs: 1600,
    name: { en: 'sphere · hold', th: 'ทรงกลม · กดค้าง' },
  },
  B: {
    key: 'B', view: 'disc', control: 'hold',
    omega: 4.0, drive: 5.1, windowMs: 1600,
    name: { en: 'disc · hold', th: 'จานกลม · กดค้าง' },
  },
  C: {
    key: 'C', view: 'disc', control: 'tap',
    omega: 5.0, drive: 50, pulseMs: 31, windowMs: 2000,
    name: { en: 'disc · tap', th: 'จานกลม · แตะ' },
  },
};

/* The settled difficulty answer from round 1: tightness. */
const BARS = [0.88, 0.93, 0.96, 0.98, 0.99, 0.995];
const TARGETS = 4;
const PREVIEW_SUBS = 90;   // 0.75s of shown future

const params = new URLSearchParams(location.search);
let variant = (params.get('variant') || 'A').toUpperCase();
if (!MECH[variant]) variant = 'A';
let lang = params.get('lang') === 'th' ? 'th' : 'en';
let sound = true;

const M = () => MECH[variant];
const pulseSubs = (m) => Math.max(1, Math.round((m.pulseMs || 0) / 1000 * 120));

/* ─────────────────────────────────────────────────────────────
   Input words — used only to CONSTRUCT reachable targets.
   ───────────────────────────────────────────────────────────── */
function holdWord(subs) {
  const b = [];
  const minSeg = 12;                       // 100ms — the human thumb floor
  let bit = Math.random() < 0.5 ? 1 : 0;
  while (b.length < subs) {
    const len = minSeg + Math.floor(Math.random() * minSeg * 2.5);
    for (let i = 0; i < len && b.length < subs; i++) b.push(bit);
    bit ^= 1;
  }
  return b;
}

function tapWord(subs, m) {
  const p = pulseSubs(m), gap = Math.round(0.18 * 120);
  const bits = new Array(subs).fill(0);
  let t = Math.floor(Math.random() * gap);
  while (t < subs) {
    for (let i = 0; i < p && t + i < subs; i++) bits[t + i] = 1;
    t += p + gap + Math.floor(Math.random() * gap * 2);
  }
  return bits;
}

const word = (subs) => (M().control === 'tap' ? tapWord(subs, M()) : holdWord(subs));

function runWord(s, bits) {
  const m = M();
  for (const b of bits) s = step(s, m.omega, b ? m.drive : 0, SUB_DT);
  return s;
}

/* Target = endpoint of a real, playable input word, so a hittable input
   provably exists. Reject endpoints you would drift into by doing nothing. */
function makeTarget(state, subs) {
  const idle = bloch(runWord(state, new Array(subs).fill(0)));
  const here = bloch(state);
  const near = (a, b) => (1 + a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / 2;
  let bT = null, bW = null, bC = Infinity;
  for (let k = 0; k < 50; k++) {
    const w = word(subs);
    const t = bloch(runWord(state, w));
    const c = Math.max(near(t, idle), near(t, here));
    if (c < bC) { bC = c; bT = t; bW = w; }
    if (c < 0.8) { window.LAST_WORD = w; return t; }
  }
  window.LAST_WORD = bW;
  return bT;
}

/* ─────────────────────────────────────────────────────────────
   Game state
   ───────────────────────────────────────────────────────────── */
const G = {
  phase: 'idle',        // idle | playing | miss | clear | done
  level: 0,
  state: null,
  target: null,
  windowSubs: 0,
  subsLeft: 0,
  hits: 0,
  held: false,
  suppress: false,      // the tap that dismissed an overlay must not also play
  pulseLeft: 0,         // substeps remaining of the current tap pulse
  trail: [],
  ringIn: 0,
  flash: 0,
  flashGood: false,
  history: [],
  tries: 0,
  bestRun: 0,
  lastFid: 0.5,
  bestFid: 0,
};

const bar = () => BARS[G.level];
const freshState = () => { const th = 0.6; return [Math.cos(th / 2), 0, Math.sin(th / 2), 0]; };

function beginLevel() {
  G.state = freshState();
  G.hits = 0; G.trail = []; G.pulseLeft = 0;
  G.phase = 'playing';
  G.tries++;
  nextTarget();
  updateChrome();
}

function nextTarget() {
  const subs = Math.round(M().windowMs / 1000 * 120);
  G.target = makeTarget(G.state, subs);
  G.windowSubs = subs;
  G.subsLeft = subs;
  G.ringIn = 0;
  G.bestFid = 0;
}

const record = (f) => { G.history.push(f); if (G.history.length > 240) G.history.shift(); };

function hitTarget() {
  record(G.bestFid);
  G.hits++;
  G.flash = 1; G.flashGood = true;
  blip(true);
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  if (G.hits >= TARGETS) {
    if (G.hits > G.bestRun) G.bestRun = G.hits;
    G.phase = G.level >= BARS.length - 1 ? 'done' : 'clear';
  } else nextTarget();
  updateChrome();
}

function missTarget() {
  record(G.bestFid);
  if (G.hits > G.bestRun) G.bestRun = G.hits;
  G.lastFid = G.bestFid;
  G.flash = 1; G.flashGood = false;
  blip(false);
  if (navigator.vibrate) { try { navigator.vibrate([25, 40, 25]); } catch (e) {} }
  G.phase = 'miss';
  updateChrome();
}

/* ─────────────────────────────────────────────────────────────
   Audio
   ───────────────────────────────────────────────────────────── */
let actx = null, drone = null, droneGain = null;

function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  drone = actx.createOscillator();
  droneGain = actx.createGain();
  drone.type = 'sine';
  drone.frequency.value = 220;
  droneGain.gain.value = 0;
  drone.connect(droneGain).connect(actx.destination);
  drone.start();
}

function tuneDrone(f, on) {
  if (!actx || !drone) return;
  droneGain.gain.setTargetAtTime((on && sound) ? 0.04 : 0, actx.currentTime, 0.05);
  drone.frequency.setTargetAtTime(170 + 620 * Math.pow(f, 3), actx.currentTime, 0.03);
}

function blip(good) {
  if (!actx || !sound) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = good ? 'triangle' : 'sawtooth';
  o.frequency.value = good ? 880 : 120;
  g.gain.setValueAtTime(0.001, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(good ? 0.14 : 0.10, actx.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (good ? 0.16 : 0.30));
  o.connect(g).connect(actx.destination);
  o.start(); o.stop(actx.currentTime + 0.34);
}

function tick() {   // the click of a fired pulse
  if (!actx || !sound) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square';
  o.frequency.value = 1400;
  g.gain.setValueAtTime(0.0008, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.05, actx.currentTime + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.07);
  o.connect(g).connect(actx.destination);
  o.start(); o.stop(actx.currentTime + 0.09);
}

/* ─────────────────────────────────────────────────────────────
   Input — the whole screen is the pad.
   ───────────────────────────────────────────────────────────── */
function onDown(e) {
  if (e.target && e.target.closest && e.target.closest('button')) return;
  if (e.preventDefault) e.preventDefault();
  ensureAudio();

  if (G.phase === 'playing') {
    if (G.suppress) return;
    if (M().control === 'tap') {
      if (G.pulseLeft <= 0) { G.pulseLeft = pulseSubs(M()); tick(); }
    } else {
      G.held = true;
    }
    return;
  }

  if (G.phase === 'clear') G.level++;
  if (G.phase === 'done') G.level = 0;
  beginLevel();
  G.held = false;
  G.suppress = true;
}

function onUp() { G.held = false; G.suppress = false; }

addEventListener('pointerdown', onDown, { passive: false });
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);
addEventListener('blur', onUp);
addEventListener('contextmenu', (e) => e.preventDefault());

/* ─────────────────────────────────────────────────────────────
   Loop — fixed timestep, so the score never depends on refresh rate.
   ───────────────────────────────────────────────────────────── */
let acc = 0, last = performance.now();

function driveNow() {
  const m = M();
  if (m.control === 'tap') return G.pulseLeft > 0;
  return G.held && !G.suppress;
}

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;

  if (G.phase === 'playing') {
    const m = M(), b = bar();
    acc += dt;
    while (acc >= SUB_DT) {
      const on = driveNow();
      if (G.pulseLeft > 0) G.pulseLeft--;
      G.state = step(G.state, m.omega, on ? m.drive : 0, SUB_DT);
      G.subsLeft--;
      acc -= SUB_DT;

      if (G.trail.length === 0 || G.subsLeft % 3 === 0) {
        G.trail.push(bloch(G.state));
        if (G.trail.length > 46) G.trail.shift();
      }

      const f = fidTo(G.state, G.target);
      if (f > G.bestFid) G.bestFid = f;
      if (f >= b) { hitTarget(); break; }
      if (G.subsLeft <= 0) { missTarget(); break; }
    }
    G.ringIn = Math.min(1, G.ringIn + dt * 7);
  } else acc = 0;

  G.flash = Math.max(0, G.flash - dt * 3.2);
  draw();
  requestAnimationFrame(frame);
}

/* ─────────────────────────────────────────────────────────────
   Projections
   ───────────────────────────────────────────────────────────── */
const cv = document.getElementById('view');
const ctx = cv.getContext('2d');
const sparkCv = document.getElementById('spark');
const sctx = sparkCv.getContext('2d');
const ELEV = 22 * Math.PI / 180;
let W = 0, H = 0, R = 0, CX = 0, CY = 0;

function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  for (const [c, cc] of [[cv, ctx], [sparkCv, sctx]]) {
    const r = c.getBoundingClientRect();
    c.width = Math.max(1, Math.round(r.width * dpr));
    c.height = Math.max(1, Math.round(r.height * dpr));
    cc.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  R = Math.min(W * 0.44, H * 0.40);
  CX = W / 2; CY = H * 0.47;
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 120));

function projSphere(v) {
  const [x, y, z] = v;
  return [CX + R * y,
          CY - R * (z * Math.cos(ELEV) - x * Math.sin(ELEV)),
          z * Math.sin(ELEV) + x * Math.cos(ELEV)];
}

/* Azimuthal equidistant: radius = polar angle. Centre is |0>, rim is |1>,
   angle around is the phase. The whole sphere, no hidden half. */
function projDisc(v) {
  const th = Math.acos(clamp1(v[2]));
  const ph = Math.atan2(v[1], v[0]);
  const rr = (th / Math.PI) * R;
  return [CX + rr * Math.cos(ph), CY + rr * Math.sin(ph), 1];
}

const proj = (v) => (M().view === 'disc' ? projDisc(v) : projSphere(v));

/* screen radius of an angular tolerance, per view */
function tolPx(tol) {
  return M().view === 'disc' ? R * (tol / Math.PI) : R * Math.sin(tol);
}

function strokePath(pts, near, far, width) {
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0, d0] = proj(pts[i - 1]);
    const [x1, y1, d1] = proj(pts[i]);
    if (Math.hypot(x1 - x0, y1 - y0) > R * 1.2) continue;   // seam guard
    const front = (d0 + d1) / 2 > 0;
    ctx.strokeStyle = front ? near : far;
    ctx.lineWidth = width * (front ? 1 : 0.75);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
}

function circleOnSphere(axis, steps) {
  const c = axis;
  const a = Math.abs(c[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  let u = [a[1] * c[2] - a[2] * c[1], a[2] * c[0] - a[0] * c[2], a[0] * c[1] - a[1] * c[0]];
  const un = Math.hypot(u[0], u[1], u[2]); u = u.map(k => k / un);
  const v = [c[1] * u[2] - c[2] * u[1], c[2] * u[0] - c[0] * u[2], c[0] * u[1] - c[1] * u[0]];
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const p = i / steps * TAU, cp = Math.cos(p), sp = Math.sin(p);
    out.push([u[0] * cp + v[0] * sp, u[1] * cp + v[1] * sp, u[2] * cp + v[2] * sp]);
  }
  return out;
}

/* ─────────────────────────────────────────────────────────────
   The missing mental model: show BOTH futures.
   ───────────────────────────────────────────────────────────── */
function futurePath(driven) {
  const m = M();
  let s = G.state;
  const pts = [bloch(s)];
  if (m.control === 'tap' && driven) {
    const p = pulseSubs(m);
    for (let i = 0; i < p; i++) s = step(s, m.omega, m.drive, SUB_DT);
    pts.push(bloch(s));
  }
  const on = m.control === 'tap' ? false : driven;
  for (let i = 0; i < PREVIEW_SUBS; i++) {
    s = step(s, m.omega, on ? m.drive : 0, SUB_DT);
    if (i % 4 === 0) pts.push(bloch(s));
  }
  return pts;
}

const lerp = (a, b, t) => a + (b - a) * t;

function fidColor(f) {
  if (f < 0.6) return '#E87979';
  if (f < 0.93) {
    const t = (f - 0.6) / 0.33;
    return `rgb(${Math.round(lerp(232, 212, t))},${Math.round(lerp(121, 165, t))},${Math.round(lerp(121, 116, t))})`;
  }
  const t = Math.min(1, (f - 0.93) / 0.07);
  return `rgb(${Math.round(lerp(212, 123, t))},${Math.round(lerp(165, 196, t))},${Math.round(lerp(116, 127, t))})`;
}

/* ─────────────────────────────────────────────────────────────
   Render
   ───────────────────────────────────────────────────────────── */
function drawBackdrop() {
  const disc = M().view === 'disc';

  const g = ctx.createRadialGradient(CX - R * 0.3, CY - R * 0.4, R * 0.1, CX, CY, R);
  g.addColorStop(0, 'rgba(38,40,54,.5)');
  g.addColorStop(1, 'rgba(16,18,26,.22)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(86,84,94,.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();

  if (disc) {
    // latitude rings at 45/90/135 degrees; the 90 ring is the equator
    for (const deg of [45, 90, 135]) {
      ctx.strokeStyle = deg === 90 ? 'rgba(139,107,174,.5)' : 'rgba(86,84,94,.28)';
      ctx.lineWidth = deg === 90 ? 1.2 : 1;
      ctx.beginPath(); ctx.arc(CX, CY, R * (deg / 180), 0, TAU); ctx.stroke();
    }
    // spokes mark the phase clock
    ctx.strokeStyle = 'rgba(86,84,94,.18)';
    ctx.lineWidth = 1;
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a) * R * 0.12, CY + Math.sin(a) * R * 0.12);
      ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(139,137,131,.5)';
    ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText('|0⟩', CX + 9, CY - 7);          // offset so the state dot never sits on it
    ctx.textAlign = 'center';
    ctx.fillText('|1⟩', CX, CY + R - 9);
    ctx.textAlign = 'left';
  } else {
    strokePath(circleOnSphere([0, 0, 1], 96), 'rgba(139,107,174,.55)', 'rgba(139,107,174,.16)', 1.2);
    strokePath(circleOnSphere([0, 1, 0], 96), 'rgba(86,84,94,.32)', 'rgba(86,84,94,.1)', 1);
    const [nx, ny] = proj([0, 0, 1]), [sx, sy] = proj([0, 0, -1]);
    ctx.strokeStyle = 'rgba(86,84,94,.4)';
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(sx, sy); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function draw() {
  if (!W) fit();
  ctx.clearRect(0, 0, W, H);

  const m = M();
  const playing = G.phase === 'playing';
  const f = (G.target && G.state) ? fidTo(G.state, G.target) : 0.5;
  const b = bar();

  drawBackdrop();

  // ── target zone ────────────────────────────────────────────
  if (G.target) {
    const tol = Math.acos(clamp1(2 * b - 1));
    const a = 0.25 + 0.75 * G.ringIn;
    const warm = playing ? Math.max(0, Math.min(1, (G.bestFid - 0.4) / (b - 0.4))) : 0;
    const [tx, ty, td] = proj(G.target);
    const ta = td > 0 ? a : 0.4 * a;
    const rad = Math.max(5, tolPx(tol));

    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.clip();

    const gg = ctx.createRadialGradient(tx, ty, 0, tx, ty, rad);
    gg.addColorStop(0, `rgba(212,165,116,${(0.22 + 0.24 * warm) * ta})`);
    gg.addColorStop(0.7, `rgba(212,165,116,${(0.09 + 0.11 * warm) * ta})`);
    gg.addColorStop(1, 'rgba(212,165,116,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(tx, ty, rad, 0, TAU); ctx.fill();

    ctx.strokeStyle = `rgba(212,165,116,${(0.5 + 0.4 * warm) * ta})`;
    ctx.lineWidth = 1.2 + 0.8 * warm;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.arc(tx, ty, rad, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);

    if (playing && G.bestFid > 0.45 && G.bestFid < b) {
      const got = Math.acos(clamp1(2 * G.bestFid - 1));
      ctx.strokeStyle = `rgba(139,107,174,${0.45 * a})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tx, ty, Math.max(4, tolPx(got)), 0, TAU); ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = `rgba(212,165,116,${ta})`;
    ctx.beginPath(); ctx.arc(tx, ty, 3.6, 0, TAU); ctx.fill();
  }

  // ── both futures: the mental model this game was missing ───
  if (playing) {
    const driving = driveNow();
    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R * 1.02, 0, TAU); ctx.clip();

    // where you drift if you do nothing
    strokePath(futurePath(false),
      driving ? 'rgba(139,107,174,.3)' : 'rgba(139,107,174,.75)',
      'rgba(139,107,174,.14)', driving ? 1.2 : 2);

    // where the drive (or the next tap) takes you
    strokePath(futurePath(true),
      driving || m.control === 'tap' ? 'rgba(212,165,116,.8)' : 'rgba(212,165,116,.4)',
      'rgba(212,165,116,.16)', driving || m.control === 'tap' ? 2.2 : 1.3);

    ctx.restore();
  }

  // ── trail ──────────────────────────────────────────────────
  if (G.trail.length > 1) {
    for (let i = 1; i < G.trail.length; i++) {
      const t = i / G.trail.length;
      const [x0, y0] = proj(G.trail[i - 1]);
      const [x1, y1, d1] = proj(G.trail[i]);
      if (Math.hypot(x1 - x0, y1 - y0) > R * 1.2) continue;
      ctx.strokeStyle = `rgba(232,121,121,${0.04 + 0.30 * t * (d1 > 0 ? 1 : 0.4)})`;
      ctx.lineWidth = 1 + 1.4 * t;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
  }

  // ── the state itself ───────────────────────────────────────
  if (G.state) {
    const r = bloch(G.state);
    const [px, py, pd] = proj(r);
    const col = fidColor(f);
    const driving = playing && driveNow();

    if (m.view === 'sphere') {
      const [ox, oy] = proj([0, 0, 0]);
      ctx.strokeStyle = col;
      ctx.lineWidth = pd > 0 ? 2.4 : 1.6;
      ctx.globalAlpha = pd > 0 ? 1 : 0.5;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(px, py); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.shadowBlur = driving ? 22 : 14;
    ctx.shadowColor = col;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(px, py, driving ? 8 : 6, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;

    // a pulse firing gets a visible ring so the tap has weight
    if (m.control === 'tap' && G.pulseLeft > 0) {
      ctx.strokeStyle = 'rgba(212,165,116,.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 14, 0, TAU); ctx.stroke();
    }
  }

  // ── time budget ────────────────────────────────────────────
  if (playing && G.windowSubs) {
    const frac = Math.max(0, G.subsLeft / G.windowSubs);
    const rr = R * 1.09;
    ctx.strokeStyle = 'rgba(86,84,94,.25)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, CY, rr, 0, TAU); ctx.stroke();
    // deliberately NOT gold: gold is the target and the drive-preview, and a
    // gold timer ring competes with both
    ctx.strokeStyle = frac < 0.25 ? '#E87979' : 'rgba(139,137,131,.7)';
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(CX, CY, rr, -Math.PI / 2, -Math.PI / 2 + frac * TAU);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  if (G.flash > 0.01) {
    const k = 1 - G.flash;
    ctx.strokeStyle = G.flashGood
      ? `rgba(123,196,127,${G.flash * G.flash * 0.9})`
      : `rgba(232,121,121,${G.flash * G.flash * 0.9})`;
    ctx.lineWidth = 5 * G.flash;
    ctx.beginPath(); ctx.arc(CX, CY, R * (0.98 + 0.55 * k), 0, TAU); ctx.stroke();
  }

  fidEl.textContent = (f * 100).toFixed(1) + '%';
  fidEl.style.color = fidColor(f);
  fidLabelEl.textContent = (playing && G.bestFid > 0.02)
    ? `${fidLabelBase} · ${peakWord} ${(G.bestFid * 100).toFixed(0)}%`
    : fidLabelBase;
  tuneDrone(f, playing);

  drawSpark();
}

function drawSpark() {
  const r = sparkCv.getBoundingClientRect();
  const w = r.width, h = r.height;
  sctx.clearRect(0, 0, w, h);
  const b = bar();
  const yBar = h - (b - 0.4) / 0.6 * h;
  sctx.strokeStyle = 'rgba(212,165,116,.5)';
  sctx.setLineDash([3, 3]);
  sctx.beginPath(); sctx.moveTo(0, yBar); sctx.lineTo(w, yBar); sctx.stroke();
  sctx.setLineDash([]);

  const data = G.history.slice(-40);
  if (!data.length) return;
  const slot = w / 40;
  const bw = Math.max(1.5, Math.min(6, slot - 1.5));
  data.forEach((v, i) => {
    const x = w - (data.length - i) * slot;
    const y = h - Math.max(0, (v - 0.4) / 0.6) * h;
    sctx.fillStyle = v >= b ? 'rgba(123,196,127,.85)' : 'rgba(232,121,121,.55)';
    sctx.fillRect(x, y, bw, h - y);
  });
}

/* ─────────────────────────────────────────────────────────────
   Copy
   ───────────────────────────────────────────────────────────── */
const I18N = {
  en: {
    fidelity: 'fidelity', peak: 'best', tries: 'tries', best: 'best run',
    startHold: 'TAP AND HOLD',
    startTap: 'TAP TO PULSE',
    subHold: 'Hold to drive, let go and it drifts. The gold line is where holding takes you, the purple line where letting go takes you. Get into the gold zone.',
    subTap: 'Each tap fires a 90° pulse. The gold line shows where the next tap lands you, the purple line where you drift if you wait. Wait for the phase, then tap.',
    hint: 'tap to begin',
    miss: 'MISS', missSub: (f, b) => `${(f * 100).toFixed(1)}% — needed ${(b * 100).toFixed(1)}%`,
    retry: 'tap to retry',
    clear: 'LEVEL CLEAR', clearSub: (n) => `Level ${n} of ${BARS.length}`, nextHint: 'tap for next level',
    done: 'ALL LEVELS CLEAR', doneSub: 'Switch mechanic at the bottom and compare how it feels.',
    again: 'tap to replay',
  },
  th: {
    fidelity: 'ความเหมือน', peak: 'ดีสุด', tries: 'ครั้ง', best: 'สถิติ',
    startHold: 'แตะค้างไว้',
    startTap: 'แตะเพื่อยิงพัลส์',
    subHold: 'กดค้างเพื่อขับ ปล่อยแล้วมันจะลอยไปเอง เส้นสีทองคือทางที่จะไปถ้ากดค้าง เส้นสีม่วงคือถ้าปล่อย พาไปให้ถึงวงสีทอง',
    subTap: 'แตะหนึ่งครั้ง = พัลส์ 90° เส้นสีทองคือจุดที่จะไปถ้าแตะตอนนี้ เส้นสีม่วงคือถ้ารอ รอจังหวะให้ดีแล้วค่อยแตะ',
    hint: 'แตะเพื่อเริ่ม',
    miss: 'พลาด', missSub: (f, b) => `${(f * 100).toFixed(1)}% — ต้องได้ ${(b * 100).toFixed(1)}%`,
    retry: 'แตะเพื่อเล่นใหม่',
    clear: 'ผ่านด่าน', clearSub: (n) => `ด่าน ${n} จาก ${BARS.length}`, nextHint: 'แตะเพื่อไปด่านต่อไป',
    done: 'ผ่านครบทุกด่าน', doneSub: 'เปลี่ยนกลไกด้านล่างแล้วลองเทียบความรู้สึกดู',
    again: 'แตะเพื่อเล่นอีก',
  },
};

const fidEl = document.getElementById('fid');
const fidLabelEl = document.getElementById('fidLabel');
let fidLabelBase = 'fidelity', peakWord = 'best';
const veil = document.getElementById('veil');
const veilBig = document.getElementById('veilBig');
const veilSub = document.getElementById('veilSub');
const veilHint = document.getElementById('veilHint');

function updateChrome() {
  const m = M(), t = I18N[lang], b = bar();
  const isTap = m.control === 'tap';

  document.getElementById('mKey').textContent = m.key;
  document.getElementById('mName').textContent = m.name[lang];
  document.getElementById('cur').textContent = `${m.key} — ${m.name.en}`;
  const deg = (Math.acos(clamp1(2 * b - 1)) * 180 / Math.PI).toFixed(0);
  document.getElementById('knob').innerHTML =
    `<b>${(b * 100).toFixed(1)}%</b> <span>· ${deg}° · ω${m.omega} · ${m.windowMs}ms</span>`;

  fidLabelBase = t.fidelity;
  peakWord = t.peak;
  document.getElementById('labTries').textContent = t.tries;
  document.getElementById('labBest').textContent = t.best;
  document.getElementById('tries').textContent = G.tries;
  document.getElementById('best').textContent = G.bestRun;
  document.getElementById('btnLang').textContent = lang === 'en' ? 'EN' : 'ไทย';

  const pips = document.getElementById('pips');
  pips.innerHTML = '';
  BARS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'pip' + (i < G.level ? ' done' : i === G.level ? ' now' : '');
    pips.appendChild(d);
  });

  const chain = document.getElementById('chain');
  chain.innerHTML = '';
  for (let i = 0; i < TARGETS; i++) {
    const d = document.createElement('div');
    d.className = 'link' + (i < G.hits ? ' hit' : (i === G.hits && G.phase === 'playing') ? ' now' : '');
    chain.appendChild(d);
  }

  if (G.phase === 'playing') { veil.hidden = true; return; }
  veil.hidden = false;
  if (G.phase === 'idle') {
    veilBig.textContent = isTap ? t.startTap : t.startHold;
    veilBig.style.color = 'var(--ink)';
    veilSub.textContent = isTap ? t.subTap : t.subHold;
    veilHint.textContent = t.hint;
  } else if (G.phase === 'miss') {
    veilBig.textContent = t.miss; veilBig.style.color = 'var(--coral)';
    veilSub.textContent = t.missSub(G.lastFid, b); veilHint.textContent = t.retry;
  } else if (G.phase === 'clear') {
    veilBig.textContent = t.clear; veilBig.style.color = 'var(--good)';
    veilSub.textContent = t.clearSub(G.level + 1); veilHint.textContent = t.nextHint;
  } else {
    veilBig.textContent = t.done; veilBig.style.color = 'var(--good)';
    veilSub.textContent = t.doneSub; veilHint.textContent = t.again;
  }
}

/* ─────────────────────────────────────────────────────────────
   Switcher — prototype only, never ships
   ───────────────────────────────────────────────────────────── */
const ORDER = ['A', 'B', 'C'];

function go(dir) {
  variant = ORDER[(ORDER.indexOf(variant) + dir + ORDER.length) % ORDER.length];
  const p = new URLSearchParams(location.search);
  p.set('variant', variant);
  history.replaceState(null, '', location.pathname + '?' + p);
  G.level = 0; G.tries = 0; G.bestRun = 0; G.history = [];
  G.phase = 'idle'; G.state = freshState(); G.target = null;
  G.trail = []; G.pulseLeft = 0;
  updateChrome();
}

for (const [id, dir] of [['prev', -1], ['next', 1]]) {
  const el = document.getElementById(id);
  el.addEventListener('click', (e) => { e.stopPropagation(); go(dir); });
}
document.getElementById('switcher').addEventListener('pointerdown', (e) => e.stopPropagation());

const bl = document.getElementById('btnLang');
bl.addEventListener('click', (e) => { e.stopPropagation(); lang = lang === 'en' ? 'th' : 'en'; updateChrome(); });
bl.addEventListener('pointerdown', (e) => e.stopPropagation());

const bs = document.getElementById('btnSound');
bs.addEventListener('click', (e) => {
  e.stopPropagation();
  sound = !sound;
  bs.setAttribute('aria-pressed', String(sound));
  bs.textContent = sound ? '♪' : '✕';
});
bs.addEventListener('pointerdown', (e) => e.stopPropagation());

addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
  if (e.code === 'Space') { e.preventDefault(); onDown({ target: document.body }); }
});
addEventListener('keyup', (e) => { if (e.code === 'Space') onUp(); });

G.state = freshState();
fit();
updateChrome();
requestAnimationFrame(frame);
</script>
