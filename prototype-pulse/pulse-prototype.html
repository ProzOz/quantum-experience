<title>PULSE — difficulty ladder prototype</title>

<!--
  PROTOTYPE — throwaway. Not production code.

  Question it answers (ADR-0003, "Still open"): omega is a tuning parameter with
  a sweet spot, not a difficulty knob. So where does difficulty come from —
  target TIGHTNESS, target COUNT, or a shorter frame BUDGET?

  Three ladders on one game, switchable via ?variant=A|B|C and the bar at the
  bottom. The game is held VISUALLY IDENTICAL across all three; only the one
  varied parameter changes. That is what makes the comparison valid, and is a
  deliberate departure from the usual "variants must differ structurally" rule —
  here the variants are the difficulty axes, not the looks.

    A — TIGHTNESS : bar rises 80 -> 99.3%,  4 targets, 700ms window
    B — COUNT     : 2 -> 18 targets,        bar 93%,   700ms window
    C — BUDGET    : window 900 -> 250ms,    bar 93%,   4 targets

  Every target is generated as the endpoint of a real, human-feasible input word
  from the CURRENT state, so a hittable input provably exists for every target
  (ceiling 100% by construction). Without this, randomly-placed targets at 550ms
  and below have worst-case ceilings of 78%/62%/51%/27% and levels are silently
  impossible. See pulse-solve2.js / pulse-levels.js.

  No persistence — session only. (LINE in-app localStorage is untested per ADR-0003.)
-->

<script>
/* ─────────────────────────────────────────────────────────────
   Local-file fallback: the Artifact host supplies a viewport meta,
   a bare file:// open does not.
   ───────────────────────────────────────────────────────────── */
if (!document.querySelector('meta[name=viewport]')) {
  const m = document.createElement('meta');
  m.name = 'viewport';
  m.content = 'width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1';
  document.head.appendChild(m);
}

/* ─────────────────────────────────────────────────────────────
   Physics — H = (w/2)sz + (W/2)sx, drive gated by the thumb.
   One qubit as a spinor (a,b); global phase carried, never scored.
   Identical maths to pulse-solve2.js so the solver's ceilings apply.
   ───────────────────────────────────────────────────────────── */
const OMEGA = 11;      // Larmor precession about Z — ADR-0003 sweet spot 9..13
const DRIVE = 14;      // Rabi drive about X while held
const SUB_DT = 1 / 120;
const TICK_SUBS = 2;   // 2 substeps = one 60Hz decision tick
const MIN_SEG = 6;     // ticks (100ms) — the human thumb floor

function step(s, driveOn, dt) {
  const nx = driveOn ? DRIVE : 0, nz = OMEGA;
  const nn = Math.hypot(nx, nz);
  const th = nn * dt, c = Math.cos(th / 2), sn = Math.sin(th / 2);
  const u = -sn * (nz / nn), v = -sn * (nx / nn);
  const [ar, ai, br, bi] = s;
  return [
    c * ar - u * ai - v * bi,
    c * ai + u * ar + v * br,
    -v * ai + c * br + u * bi,
    v * ar + c * bi - u * br,
  ];
}

function bloch(s) {
  const [ar, ai, br, bi] = s;
  return [2 * (ar * br + ai * bi), 2 * (ar * bi - ai * br),
          ar * ar + ai * ai - br * br - bi * bi];
}

// |<target|psi>|^2 for pure states = (1 + r.t)/2 on the Bloch sphere.
function fidTo(s, t) {
  const r = bloch(s);
  return (1 + r[0] * t[0] + r[1] * t[1] + r[2] * t[2]) / 2;
}

const runTicks = (s, bits) => {
  for (const bit of bits)
    for (let q = 0; q < TICK_SUBS; q++) s = step(s, bit, SUB_DT);
  return s;
};

/* A word a thumb could actually execute: every segment >= MIN_SEG ticks. */
function humanWord(ticks) {
  const bits = [];
  let bit = Math.random() < 0.5 ? 1 : 0;
  while (bits.length < ticks) {
    const len = MIN_SEG + Math.floor(Math.random() * MIN_SEG * 2.5);
    for (let i = 0; i < len && bits.length < ticks; i++) bits.push(bit);
    bit ^= 1;
  }
  return bits;
}

/* Target = the endpoint of a real human-feasible word from the current state.
   Guarantees a hittable input exists. Reject endpoints you would drift into by
   doing nothing, or reach by just holding — those need no timing. */
function makeTarget(state, ticks) {
  const idle = bloch(runTicks(state, new Array(ticks).fill(0)));
  const full = bloch(runTicks(state, new Array(ticks).fill(1)));
  const here = bloch(state);
  const near = (a, b) => (1 + a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / 2;

  let bestT = null, bestW = null, bestCost = Infinity;
  for (let k = 0; k < 60; k++) {
    const w = humanWord(ticks);
    const t = bloch(runTicks(state, w));
    const cost = Math.max(near(t, idle), near(t, full), near(t, here));
    if (cost < bestCost) { bestCost = cost; bestT = t; bestW = w; }
    if (cost < 0.85) { window.LAST_WORD = w; return t; }
  }
  window.LAST_WORD = bestW;
  return bestT;
}

/* ─────────────────────────────────────────────────────────────
   Ladders — one varied parameter each, everything else fixed.
   ───────────────────────────────────────────────────────────── */
const LADDERS = {
  A: {
    key: 'A', name: { en: 'tightness', th: 'ความแม่นยำ' },
    fixed: { targets: 4, windowMs: 900 },
    levels: [0.70, 0.80, 0.88, 0.93, 0.96, 0.99].map(bar => ({ bar })),
    knob: (L, lang) => {
      const deg = (Math.acos(2 * L.bar - 1) * 180 / Math.PI).toFixed(0);
      return `<b>${(L.bar * 100).toFixed(0)}%</b> <span>bar · ${deg}° ${lang === 'th' ? 'รัศมี' : 'radius'}</span>`;
    },
  },
  B: {
    key: 'B', name: { en: 'count', th: 'จำนวนเป้า' },
    fixed: { bar: 0.88, windowMs: 900 },
    levels: [2, 4, 6, 9, 13, 18].map(targets => ({ targets })),
    knob: (L, lang) => `<b>${L.targets}</b> <span>${lang === 'th' ? 'เป้าติดกัน' : 'in a row'} · 88% bar</span>`,
  },
  C: {
    key: 'C', name: { en: 'budget', th: 'เวลาที่ให้' },
    fixed: { bar: 0.93, targets: 4 },
    levels: [1600, 1200, 900, 700, 500, 400].map(windowMs => ({ windowMs })),
    knob: (L, lang) => `<b>${L.windowMs}ms</b> <span>${lang === 'th' ? 'ต่อเป้า' : 'per target'} · 93% bar</span>`,
  },
};

const I18N = {
  en: {
    fidelity: 'fidelity', peak: 'best', tries: 'tries', best: 'best run',
    start: 'TAP AND HOLD', startSub: 'Hold to drive the qubit, let go and it precesses. Touch the gold ring before the timer runs out. You cannot mash this — wait for the phase.',
    hint: 'tap to begin',
    miss: 'MISS', missSub: (f, b) => `${(f * 100).toFixed(1)}% — needed ${(b * 100).toFixed(1)}%`,
    retry: 'tap to retry',
    clear: 'LEVEL CLEAR', clearSub: (n) => `Level ${n} of 6`, nextHint: 'tap for next level',
    done: 'LADDER COMPLETE', doneSub: 'You cleared every rung. Switch ladders at the bottom.',
    again: 'tap to replay',
  },
  th: {
    fidelity: 'ความเหมือน', peak: 'ดีสุด', tries: 'ครั้ง', best: 'สถิติ',
    start: 'แตะค้างไว้', startSub: 'กดค้างเพื่อขับคิวบิต ปล่อยแล้วมันจะหมุนเอง พาไปแตะวงแหวนสีทองให้ทันเวลา กดรัวไม่ได้ผล ต้องรอจังหวะ',
    hint: 'แตะเพื่อเริ่ม',
    miss: 'พลาด', missSub: (f, b) => `${(f * 100).toFixed(1)}% — ต้องได้ ${(b * 100).toFixed(1)}%`,
    retry: 'แตะเพื่อเล่นใหม่',
    clear: 'ผ่านด่าน', clearSub: (n) => `ด่าน ${n} จาก 6`, nextHint: 'แตะเพื่อไปด่านต่อไป',
    done: 'จบทุกด่าน', doneSub: 'ผ่านครบทุกขั้นแล้ว เปลี่ยนแกนความยากด้านล่าง',
    again: 'แตะเพื่อเล่นอีก',
  },
};

/* ─────────────────────────────────────────────────────────────
   Game state
   ───────────────────────────────────────────────────────────── */
const params = new URLSearchParams(location.search);
let variant = (params.get('variant') || 'A').toUpperCase();
if (!LADDERS[variant]) variant = 'A';
let lang = (params.get('lang') === 'th') ? 'th' : 'en';
let sound = true;

const G = {
  phase: 'idle',      // idle | playing | miss | clear | done
  level: 0,
  state: null,
  target: null,
  windowSubs: 0,
  subsLeft: 0,
  hits: 0,
  held: false,
  ignoreHold: false,  // a tap that dismissed an overlay must not count as drive
  trail: [],
  ringIn: 0,          // 0..1 fade-in of a freshly placed target
  flash: 0,
  flashGood: false,
  history: [],        // fidelity of every resolved target this session
  tries: 0,
  bestRun: 0,
  lastFid: 0.5,
  bestFid: 0,         // best fidelity reached while the current target is live
};

function cfg() {
  const L = LADDERS[variant];
  return Object.assign({}, L.fixed, L.levels[G.level]);
}

/* start state: latitude 35°, so the sphere is already precessing on frame 1 */
function freshState() {
  const th = 35 * Math.PI / 180;
  return [Math.cos(th / 2), 0, Math.sin(th / 2), 0];
}

function beginLevel() {
  G.state = freshState();
  G.hits = 0;
  G.trail = [];
  G.phase = 'playing';
  G.tries++;
  nextTarget();
  updateChrome();
}

function nextTarget() {
  const c = cfg();
  const ticks = Math.round(c.windowMs / 1000 * 60);
  G.target = makeTarget(G.state, ticks);
  G.windowSubs = ticks * TICK_SUBS;
  G.subsLeft = G.windowSubs;
  G.ringIn = 0;
  G.bestFid = 0;
}

/* Scoring: the target locks in the INSTANT you touch the bar, and the score is
   the best fidelity reached while it was live — not wherever the vector
   happened to be at the buzzer. Still fully deterministic, so ADR-0003's
   no-dice requirement holds. Buzzer scoring was measured and it is what made
   every ladder unplayable: at a 700ms window and an 80% bar it took a thumb
   from 75.6% down to 25.4% per target. */
function record(f) {
  G.history.push(f);
  if (G.history.length > 240) G.history.shift();
}

function hitTarget() {
  const c = cfg();
  record(G.bestFid);
  G.hits++;
  G.flash = 1; G.flashGood = true;
  blip(true);
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  if (G.hits >= c.targets) {
    if (G.hits > G.bestRun) G.bestRun = G.hits;
    G.phase = (G.level >= LADDERS[variant].levels.length - 1) ? 'done' : 'clear';
  } else {
    nextTarget();
  }
  updateChrome();
}

function missTarget() {
  record(G.bestFid);
  if (G.hits > G.bestRun) G.bestRun = G.hits;
  G.lastFid = G.bestFid;
  G.flash = 1; G.flashGood = false;
  blip(false);
  if (navigator.vibrate) { try { navigator.vibrate([25, 40, 25]); } catch (e) {} }
  G.phase = 'miss';
  updateChrome();
}

/* ─────────────────────────────────────────────────────────────
   Audio — a drone whose pitch tracks fidelity gives eyes-free
   feedback, which is the whole point of a timing game.
   ───────────────────────────────────────────────────────────── */
let actx = null, drone = null, droneGain = null;

function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  drone = actx.createOscillator();
  droneGain = actx.createGain();
  drone.type = 'sine';
  drone.frequency.value = 220;
  droneGain.gain.value = 0;
  drone.connect(droneGain).connect(actx.destination);
  drone.start();
}

function tuneDrone(f, on) {
  if (!actx || !drone) return;
  const want = (on && sound) ? 0.045 : 0;
  droneGain.gain.setTargetAtTime(want, actx.currentTime, 0.05);
  drone.frequency.setTargetAtTime(170 + 620 * Math.pow(f, 3), actx.currentTime, 0.03);
}

function blip(good) {
  if (!actx || !sound) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = good ? 'triangle' : 'sawtooth';
  o.frequency.value = good ? 880 : 120;
  g.gain.setValueAtTime(0.001, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(good ? 0.14 : 0.10, actx.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (good ? 0.16 : 0.30));
  o.connect(g).connect(actx.destination);
  o.start(); o.stop(actx.currentTime + 0.34);
}

/* ─────────────────────────────────────────────────────────────
   Input — the whole screen is the pad.
   ───────────────────────────────────────────────────────────── */
function onDown(e) {
  if (e.target.closest('button')) return;
  e.preventDefault();
  ensureAudio();

  if (G.phase === 'playing') { G.held = true; return; }

  // any overlay: this tap advances, and must not also drive
  if (G.phase === 'clear') G.level++;
  if (G.phase === 'done') G.level = 0;
  beginLevel();
  G.held = false;
  G.ignoreHold = true;
}

function onUp() {
  G.held = false;
  G.ignoreHold = false;
}

addEventListener('pointerdown', onDown, { passive: false });
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);
addEventListener('blur', onUp);
addEventListener('contextmenu', (e) => e.preventDefault());

/* ─────────────────────────────────────────────────────────────
   Loop — fixed timestep, so fidelity is deterministic regardless
   of the phone's refresh rate. This is load-bearing: the whole
   design rests on the score having no dice in it.
   ───────────────────────────────────────────────────────────── */
let acc = 0, last = performance.now();

function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;

  if (G.phase === 'playing') {
    const bar = cfg().bar;
    acc += dt;
    while (acc >= SUB_DT) {
      const driving = G.held && !G.ignoreHold;
      G.state = step(G.state, driving, SUB_DT);
      G.subsLeft--;
      acc -= SUB_DT;

      if (G.trail.length === 0 || G.subsLeft % 3 === 0) {
        G.trail.push(bloch(G.state));
        if (G.trail.length > 40) G.trail.shift();
      }

      const f = fidTo(G.state, G.target);
      if (f > G.bestFid) G.bestFid = f;
      if (f >= bar) { hitTarget(); break; }        // lock in the moment you touch it
      if (G.subsLeft <= 0) { missTarget(); break; }
    }
    G.ringIn = Math.min(1, G.ringIn + dt * 7);
  } else {
    acc = 0;
  }

  G.flash = Math.max(0, G.flash - dt * 3.2);
  draw();
  requestAnimationFrame(frame);
}

/* ─────────────────────────────────────────────────────────────
   Render
   ───────────────────────────────────────────────────────────── */
const cv = document.getElementById('sphere');
const ctx = cv.getContext('2d');
const sparkCv = document.getElementById('spark');
const sctx = sparkCv.getContext('2d');
const ELEV = 22 * Math.PI / 180;
let W = 0, H = 0, R = 0, CX = 0, CY = 0;

function fit() {
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  for (const [c, cc] of [[cv, ctx], [sparkCv, sctx]]) {
    const r = c.getBoundingClientRect();
    c.width = Math.max(1, Math.round(r.width * dpr));
    c.height = Math.max(1, Math.round(r.height * dpr));
    cc.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  R = Math.min(W * 0.44, H * 0.40);
  CX = W / 2; CY = H * 0.47;
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 120));

/* camera: azimuth 0, elevation ELEV. depth > 0 is the near hemisphere. */
function proj(v) {
  const [x, y, z] = v;
  const sx = CX + R * y;
  const sy = CY - R * (z * Math.cos(ELEV) - x * Math.sin(ELEV));
  const depth = z * Math.sin(ELEV) + x * Math.cos(ELEV);
  return [sx, sy, depth];
}

function ring(center, angRad, steps) {
  // orthonormal basis perpendicular to `center`
  const c = center;
  let a = Math.abs(c[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  let u = [a[1] * c[2] - a[2] * c[1], a[2] * c[0] - a[0] * c[2], a[0] * c[1] - a[1] * c[0]];
  const un = Math.hypot(u[0], u[1], u[2]); u = u.map(k => k / un);
  const v = [c[1] * u[2] - c[2] * u[1], c[2] * u[0] - c[0] * u[2], c[0] * u[1] - c[1] * u[0]];
  const out = [], ca = Math.cos(angRad), sa = Math.sin(angRad);
  for (let i = 0; i <= steps; i++) {
    const p = i / steps * Math.PI * 2, cp = Math.cos(p), sp = Math.sin(p);
    out.push([
      c[0] * ca + (u[0] * cp + v[0] * sp) * sa,
      c[1] * ca + (u[1] * cp + v[1] * sp) * sa,
      c[2] * ca + (u[2] * cp + v[2] * sp) * sa,
    ]);
  }
  return out;
}

function strokePath(pts, near, far, width) {
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0, d0] = proj(pts[i - 1]);
    const [x1, y1, d1] = proj(pts[i]);
    const front = (d0 + d1) / 2 > 0;
    ctx.strokeStyle = front ? near : far;
    ctx.lineWidth = width * (front ? 1 : 0.75);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }
}

function circleOnSphere(axis, steps) {
  const c = axis;
  let a = Math.abs(c[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0];
  let u = [a[1] * c[2] - a[2] * c[1], a[2] * c[0] - a[0] * c[2], a[0] * c[1] - a[1] * c[0]];
  const un = Math.hypot(u[0], u[1], u[2]); u = u.map(k => k / un);
  const v = [c[1] * u[2] - c[2] * u[1], c[2] * u[0] - c[0] * u[2], c[0] * u[1] - c[1] * u[0]];
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const p = i / steps * Math.PI * 2, cp = Math.cos(p), sp = Math.sin(p);
    out.push([u[0] * cp + v[0] * sp, u[1] * cp + v[1] * sp, u[2] * cp + v[2] * sp]);
  }
  return out;
}

const lerp = (a, b, t) => a + (b - a) * t;

function fidColor(f) {
  // coral -> gold -> good, so the number reads before you can parse it
  if (f < 0.6) return '#E87979';
  if (f < 0.93) {
    const t = (f - 0.6) / 0.33;
    return `rgb(${Math.round(lerp(232, 212, t))},${Math.round(lerp(121, 165, t))},${Math.round(lerp(121, 116, t))})`;
  }
  const t = Math.min(1, (f - 0.93) / 0.07);
  return `rgb(${Math.round(lerp(212, 123, t))},${Math.round(lerp(165, 196, t))},${Math.round(lerp(116, 127, t))})`;
}

function draw() {
  if (!W) fit();
  ctx.clearRect(0, 0, W, H);

  const c = cfg();
  const playing = G.phase === 'playing';
  const f = (G.target && G.state) ? fidTo(G.state, G.target) : 0.5;

  // sphere body
  const g = ctx.createRadialGradient(CX - R * 0.3, CY - R * 0.4, R * 0.1, CX, CY, R);
  g.addColorStop(0, 'rgba(38,40,54,.55)');
  g.addColorStop(1, 'rgba(16,18,26,.25)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(86,84,94,.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.stroke();

  // equator + one meridian
  strokePath(circleOnSphere([0, 0, 1], 96), 'rgba(139,107,174,.55)', 'rgba(139,107,174,.16)', 1.2);
  strokePath(circleOnSphere([0, 1, 0], 96), 'rgba(86,84,94,.35)', 'rgba(86,84,94,.12)', 1);

  // Z axis
  const [nx, ny] = proj([0, 0, 1]), [sx2, sy2] = proj([0, 0, -1]);
  ctx.strokeStyle = 'rgba(86,84,94,.4)';
  ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(sx2, sy2); ctx.stroke();
  ctx.setLineDash([]);

  // drive axis lights up while held — makes "what does holding do" legible
  const driving = playing && G.held && !G.ignoreHold;
  if (driving) {
    const [ax, ay] = proj([1, 0, 0]), [bx, by] = proj([-1, 0, 0]);
    ctx.strokeStyle = 'rgba(212,165,116,.85)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = 'rgba(212,165,116,.9)';
    ctx.beginPath(); ctx.arc(ax, ay, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  if (G.target) {
    const tol = Math.acos(Math.max(-1, Math.min(1, 2 * c.bar - 1)));
    const a = 0.25 + 0.75 * G.ringIn;
    // ring brightens as your best approach closes on the bar
    const warm = playing ? Math.max(0, Math.min(1, (G.bestFid - 0.4) / (c.bar - 0.4))) : 0;

    /* The tolerance is drawn as a ZONE, not as the true great circle. A 31°
       ring (93% bar) projects to an arc that crosses the whole sphere and reads
       as a stray diagonal; at the 70% rung it is 66° and reads as nothing at
       all. A screen-space cap keeps the one thing that must be legible — the
       zone visibly shrinks as the bar rises — at the cost of exact geometry.
       Prototype trade: legibility over projective honesty. */
    const [tx, ty, td] = proj(G.target);
    const ta = td > 0 ? a : 0.4 * a;
    const rad = Math.max(5, R * Math.sin(tol));

    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.clip();

    const gg = ctx.createRadialGradient(tx, ty, 0, tx, ty, rad);
    gg.addColorStop(0, `rgba(212,165,116,${(0.20 + 0.22 * warm) * ta})`);
    gg.addColorStop(0.7, `rgba(212,165,116,${(0.08 + 0.10 * warm) * ta})`);
    gg.addColorStop(1, 'rgba(212,165,116,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(tx, ty, rad, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = `rgba(212,165,116,${(0.5 + 0.4 * warm) * ta})`;
    ctx.lineWidth = 1.2 + 0.8 * warm;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.arc(tx, ty, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);

    // how close you have actually come — a ghost edge at your best approach
    if (playing && G.bestFid > 0.45 && G.bestFid < c.bar) {
      const got = Math.acos(Math.max(-1, Math.min(1, 2 * G.bestFid - 1)));
      ctx.strokeStyle = `rgba(139,107,174,${0.45 * a})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tx, ty, Math.max(4, R * Math.sin(got)), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();

    // target centre — a filled pip, readable at arm's length
    ctx.fillStyle = `rgba(212,165,116,${ta})`;
    ctx.beginPath(); ctx.arc(tx, ty, 3.6, 0, Math.PI * 2); ctx.fill();
  }

  /* Phase gap: the arc on the equator between where the qubit's azimuth is now
     and where the target's is. It closes on its own as the qubit precesses —
     this is the "wait for the phase" cue, drawn rather than explained. */
  if (playing && G.target && G.state) {
    const r0 = bloch(G.state);
    const ls = Math.hypot(r0[0], r0[1]), lt = Math.hypot(G.target[0], G.target[1]);
    if (ls > 0.06 && lt > 0.06) {
      const ps = Math.atan2(r0[1], r0[0]);
      const pt = Math.atan2(G.target[1], G.target[0]);
      let d = pt - ps;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      const close = 1 - Math.abs(d) / Math.PI;
      const pts = [];
      const N = 40;
      for (let i = 0; i <= N; i++) {
        const p = ps + d * (i / N);
        pts.push([Math.cos(p), Math.sin(p), 0]);
      }
      strokePath(pts,
        `rgba(212,165,116,${0.2 + 0.7 * close * close})`,
        `rgba(212,165,116,${0.06 + 0.2 * close * close})`,
        1.5 + 2.5 * close * close);
    }
  }

  // trail
  if (G.trail.length > 1) {
    for (let i = 1; i < G.trail.length; i++) {
      const t = i / G.trail.length;
      const [x0, y0] = proj(G.trail[i - 1]);
      const [x1, y1, d1] = proj(G.trail[i]);
      ctx.strokeStyle = `rgba(139,107,174,${0.06 + 0.5 * t * (d1 > 0 ? 1 : 0.4)})`;
      ctx.lineWidth = 1 + 1.6 * t;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
  }

  // state vector
  if (G.state) {
    const r = bloch(G.state);
    const [px, py, pd] = proj(r);
    const [ox, oy] = proj([0, 0, 0]);
    const col = fidColor(f);

    // dashed drop to the equatorial plane — reads the precession phase directly
    const pl = Math.hypot(r[0], r[1]);
    if (pl > 0.04) {
      const [ex, ey] = proj([r[0], r[1], 0]);
      ctx.strokeStyle = 'rgba(139,107,174,.35)';
      ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(139,107,174,.8)';
      ctx.beginPath(); ctx.arc(ex, ey, 2.4, 0, Math.PI * 2); ctx.fill();
    }

    ctx.strokeStyle = col;
    ctx.lineWidth = pd > 0 ? 2.4 : 1.6;
    ctx.globalAlpha = pd > 0 ? 1 : 0.5;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(px, py); ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.shadowBlur = 16; ctx.shadowColor = col;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(px, py, driving ? 7 : 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // time budget: an arc that drains — in ladder C this is the difficulty
  if (playing && G.windowSubs) {
    const frac = Math.max(0, G.subsLeft / G.windowSubs);
    const rr = R * 1.09;
    ctx.strokeStyle = 'rgba(86,84,94,.25)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, CY, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = frac < 0.25 ? '#E87979' : '#D4A574';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(CX, CY, rr, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // hit / miss flash
  if (G.flash > 0.01) {
    const k = 1 - G.flash;                 // 0 at the instant of impact
    ctx.strokeStyle = G.flashGood
      ? `rgba(123,196,127,${G.flash * G.flash * 0.9})`
      : `rgba(232,121,121,${G.flash * G.flash * 0.9})`;
    ctx.lineWidth = 5 * G.flash;
    ctx.beginPath();
    ctx.arc(CX, CY, R * (0.98 + 0.55 * k), 0, Math.PI * 2);
    ctx.stroke();
  }

  // live readout — the big number is what you are steering right now, the tag
  // is the best you have touched, which is what actually scores
  fidEl.textContent = (f * 100).toFixed(1) + '%';
  fidEl.style.color = fidColor(f);
  fidLabelEl.textContent = (playing && G.bestFid > 0.02)
    ? `${fidLabelBase} · ${peakWord} ${(G.bestFid * 100).toFixed(0)}%`
    : fidLabelBase;
  tuneDrone(f, playing);

  drawSpark();
}

/* the point of the whole exercise: can you SEE yourself getting better? */
function drawSpark() {
  const r = sparkCv.getBoundingClientRect();
  const w = r.width, h = r.height;
  sctx.clearRect(0, 0, w, h);
  const c = cfg();
  const data = G.history.slice(-40);

  // threshold line
  const yBar = h - (c.bar - 0.4) / 0.6 * h;
  sctx.strokeStyle = 'rgba(212,165,116,.5)';
  sctx.setLineDash([3, 3]);
  sctx.beginPath(); sctx.moveTo(0, yBar); sctx.lineTo(w, yBar); sctx.stroke();
  sctx.setLineDash([]);

  if (!data.length) return;
  const slot = w / 40;
  const bw = Math.max(1.5, Math.min(6, slot - 1.5));
  data.forEach((v, i) => {
    const x = w - (data.length - i) * slot;   // newest at the right
    const y = h - Math.max(0, (v - 0.4) / 0.6) * h;
    sctx.fillStyle = v >= c.bar ? 'rgba(123,196,127,.85)' : 'rgba(232,121,121,.55)';
    sctx.fillRect(x, y, bw, h - y);
  });
}

/* ─────────────────────────────────────────────────────────────
   Chrome
   ───────────────────────────────────────────────────────────── */
const fidEl = document.getElementById('fid');
const fidLabelEl = document.getElementById('fidLabel');
let fidLabelBase = 'fidelity', peakWord = 'best';
const veil = document.getElementById('veil');
const veilBig = document.getElementById('veilBig');
const veilSub = document.getElementById('veilSub');
const veilHint = document.getElementById('veilHint');

function updateChrome() {
  const L = LADDERS[variant];
  const c = cfg();
  const t = I18N[lang];

  document.getElementById('lKey').textContent = L.key;
  document.getElementById('lName').textContent = L.name[lang];
  document.getElementById('knob').innerHTML = L.knob(L.levels[G.level], lang);
  document.getElementById('cur').textContent = `${L.key} — ${L.name.en}`;
  fidLabelBase = t.fidelity;
  peakWord = t.peak;
  document.getElementById('labTries').textContent = t.tries;
  document.getElementById('labBest').textContent = t.best;
  document.getElementById('tries').textContent = G.tries;
  document.getElementById('best').textContent = G.bestRun;
  document.getElementById('btnLang').textContent = lang === 'en' ? 'EN' : 'ไทย';

  const pips = document.getElementById('pips');
  pips.innerHTML = '';
  L.levels.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'pip' + (i < G.level ? ' done' : i === G.level ? ' now' : '');
    pips.appendChild(d);
  });

  const chain = document.getElementById('chain');
  chain.innerHTML = '';
  for (let i = 0; i < c.targets; i++) {
    const d = document.createElement('div');
    d.className = 'link' + (i < G.hits ? ' hit' : i === G.hits && G.phase === 'playing' ? ' now' : '');
    chain.appendChild(d);
  }

  if (G.phase === 'playing') { veil.hidden = true; return; }
  veil.hidden = false;
  if (G.phase === 'idle') {
    veilBig.textContent = t.start; veilBig.style.color = 'var(--ink)';
    veilSub.textContent = t.startSub; veilHint.textContent = t.hint;
  } else if (G.phase === 'miss') {
    veilBig.textContent = t.miss; veilBig.style.color = 'var(--coral)';
    veilSub.textContent = t.missSub(G.lastFid, c.bar); veilHint.textContent = t.retry;
  } else if (G.phase === 'clear') {
    veilBig.textContent = t.clear; veilBig.style.color = 'var(--good)';
    veilSub.textContent = t.clearSub(G.level + 1); veilHint.textContent = t.nextHint;
  } else if (G.phase === 'done') {
    veilBig.textContent = t.done; veilBig.style.color = 'var(--good)';
    veilSub.textContent = t.doneSub; veilHint.textContent = t.again;
  }
}

/* ─────────────────────────────────────────────────────────────
   Switcher — prototype only, never ships
   ───────────────────────────────────────────────────────────── */
const ORDER = ['A', 'B', 'C'];

function go(dir) {
  const i = (ORDER.indexOf(variant) + dir + ORDER.length) % ORDER.length;
  variant = ORDER[i];
  const p = new URLSearchParams(location.search);
  p.set('variant', variant);
  history.replaceState(null, '', location.pathname + '?' + p);
  G.level = 0; G.tries = 0; G.bestRun = 0; G.history = [];
  G.phase = 'idle'; G.state = freshState(); G.target = null; G.trail = [];
  updateChrome();
}

document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); go(-1); });
document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); go(1); });
document.getElementById('switcher').addEventListener('pointerdown', (e) => e.stopPropagation());

document.getElementById('btnLang').addEventListener('click', (e) => {
  e.stopPropagation();
  lang = lang === 'en' ? 'th' : 'en';
  updateChrome();
});
document.getElementById('btnLang').addEventListener('pointerdown', (e) => e.stopPropagation());

const bs = document.getElementById('btnSound');
bs.addEventListener('click', (e) => {
  e.stopPropagation();
  sound = !sound;
  bs.setAttribute('aria-pressed', String(sound));
  bs.textContent = sound ? '♪' : '✕';
});
bs.addEventListener('pointerdown', (e) => e.stopPropagation());

addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
  if (e.code === 'Space') { e.preventDefault(); if (!G.held) onDown({ target: document.body, preventDefault() {} }); }
});
addEventListener('keyup', (e) => { if (e.code === 'Space') onUp(); });

/* ─────────────────────────────────────────────────────────────
   Boot
   ───────────────────────────────────────────────────────────── */
G.state = freshState();
fit();
updateChrome();
requestAnimationFrame(frame);
</script>
