server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # Notes, scrap text, and archives are never part of the classroom.
    location ~* \.(txt|md|zip|log)$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location ~* ^/(Dockerfile|nginx\.conf|nginx-security-headers\.conf|package(-lock)?\.json|skills-lock\.json)$ {
        return 404;
    }

    # Scrap files that used to sit in the repo root. 404 even if a future
    # image build copies the whole directory again.
    location ~* ^/(owner\.png|G304-product\.png|brilliant1\.webp|spaceball\.js)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Query-string ?v= is the cache buster. Keep this long only while that stays bumped.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|mp4)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
